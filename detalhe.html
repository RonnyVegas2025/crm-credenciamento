<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Detalhe</title>
  <link rel="stylesheet" href="assets/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <h1>Detalhe da Negociação</h1>
      <div class="sub" id="who">Carregando…</div>

      <div class="nav">
        <a href="dashboard.html">📊</a>
        <a href="nova.html">➕</a>
        <a href="negociacoes.html">📋</a>
        <a href="mapa.html">📍</a>
        <a href="#" id="btnLogout">🚪</a>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="grid2">
        <div>
          <div class="label">Cliente</div>
          <div id="cliente_nome" style="font-weight:700">Carregando…</div>
          <div class="small" id="cliente_meta"></div>
        </div>

        <div style="text-align:right">
          <a class="btn" href="negociacoes.html" id="btnVoltar">← Voltar</a>
        </div>
      </div>

      <div style="height:12px"></div>

      <!-- Negociação -->
      <div class="grid2">
        <div>
          <div class="label">Produto</div>
          <select id="produto">
            <option value="vegaspay">Vegas Pay</option>
            <option value="agregados">Agregados</option>
            <option value="cartoes">Cartões</option>
            <option value="credenciamento">Credenciamento</option>
            <option value="clube">Clube</option>
          </select>
        </div>

        <div>
          <div class="label">Status</div>
          <select id="status">
            <option value="negociacao">Em negociação</option>
            <option value="ativo">Ativo</option>
            <option value="sem_interesse">Sem interesse</option>
          </select>
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="grid2">
        <div>
          <div class="label">Volume (R$)</div>
          <input id="volume" type="number" step="0.01" placeholder="Ex: 25000">
        </div>

        <div>
          <div class="label">Qtd (licenças/cartões)</div>
          <input id="qtd" type="number" step="1" placeholder="Ex: 20">
        </div>
      </div>

      <div style="height:12px"></div>

      <div>
        <div class="label">Observações</div>
        <textarea id="obs" rows="4" placeholder="Anote as taxas atuais, objeções, próximos passos…"></textarea>
      </div>

      <div style="height:12px"></div>

      <div class="grid2">
        <div>
          <div class="label">Próxima ação</div>
          <input id="prox_acao" type="text" placeholder="Ex: Enviar proposta">
        </div>

        <div>
          <div class="label">Data</div>
          <input id="prox_data" type="date">
        </div>
      </div>

      <div style="height:18px"></div>
      <div class="small" style="opacity:.75;font-weight:700">Contato do cliente</div>
      <div style="height:10px"></div>

      <!-- Contato -->
      <div class="grid2">
        <div>
          <div class="label">Nome do contato</div>
          <input id="contato_nome" type="text" placeholder="Ex: João Silva">
        </div>

        <div>
          <div class="label">Telefone/WhatsApp</div>
          <input id="contato_telefone" type="text" placeholder="Ex: (19) 99999-9999">
        </div>
      </div>

      <div style="height:12px"></div>

      <div>
        <div class="label">E-mail</div>
        <input id="contato_email" type="email" placeholder="Ex: financeiro@empresa.com.br">
      </div>

      <div style="height:18px"></div>
      <div class="small" style="opacity:.75;font-weight:700">Endereço</div>
      <div style="height:10px"></div>

      <!-- Endereço -->
      <div>
        <div class="label">Endereço</div>
        <input id="endereco" type="text" placeholder="Rua, número, complemento">
      </div>

      <div style="height:12px"></div>

      <div class="grid2">
        <div>
          <div class="label">Bairro</div>
          <input id="bairro" type="text" placeholder="Ex: Centro">
        </div>
        <div>
          <div class="label">CEP</div>
          <input id="cep" type="text" placeholder="Ex: 13400-000">
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="grid2">
        <div>
          <div class="label">Cidade</div>
          <input id="cidade" type="text" placeholder="Ex: Americana">
        </div>
        <div>
          <div class="label">UF</div>
          <input id="uf" type="text" maxlength="2" placeholder="Ex: SP">
        </div>
      </div>

      <div style="height:16px"></div>

      <div class="grid2">
        <button class="btn" id="btnSalvar">Salvar alterações</button>
        <button class="btn btnGreen" id="btnSalvarVoltar">Salvar e voltar</button>
      </div>

      <div class="small" id="last" style="margin-top:10px;opacity:.8"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { sb } from "./assets/supabaseClient.js";
    import { ensureProfile, logout, toast } from "./assets/app.js";

    const el = (id)=>document.getElementById(id);

    const ctx = await ensureProfile();
    if(!ctx) throw new Error("no session");
    const { user, prof } = ctx;

    el("who").textContent = `${prof.nome || ""} • ${prof.role}`;
    el("btnLogout").addEventListener("click",(e)=>{ e.preventDefault(); logout(); });

    const params = new URLSearchParams(location.search);
    const actionId = params.get("id");
    if(!actionId){
      toast("Sem ID na URL. Volte e clique na linha de novo.");
      throw new Error("missing id");
    }

    // volta mantendo filtros
    const backParams = new URLSearchParams(location.search);
    backParams.delete("id");
    const backUrl = "negociacoes.html" + (backParams.toString() ? `?${backParams.toString()}` : "");
    el("btnVoltar").href = backUrl;

    async function load(){
      const { data, error } = await sb
        .from("actions")
        .select("*")
        .eq("id", actionId)
        .single();

      if(error){
        toast("Erro ao carregar: " + error.message);
        return;
      }

      el("cliente_nome").textContent = data.cliente_nome || "—";
      el("cliente_meta").textContent =
        `${data.cidade || ""}${data.uf ? " • " + data.uf : ""}${data.cnpj ? " • " + data.cnpj : ""}`;

      el("produto").value = data.produto || "vegaspay";
      el("status").value = data.status || "negociacao";
      el("volume").value = (data.volume ?? "");
      el("qtd").value = (data.qtd ?? "");
      el("obs").value = (data.obs ?? "");
      el("prox_acao").value = (data.prox_acao ?? "");

      if(data.prox_data){
        const d = new Date(data.prox_data);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth()+1).padStart(2,"0");
        const dd = String(d.getDate()).padStart(2,"0");
        el("prox_data").value = `${yyyy}-${mm}-${dd}`;
      } else {
        el("prox_data").value = "";
      }

      // novos campos
      el("contato_nome").value = (data.contato_nome ?? "");
      el("contato_telefone").value = (data.contato_telefone ?? "");
      el("contato_email").value = (data.contato_email ?? "");
      el("endereco").value = (data.endereco ?? "");
      el("bairro").value = (data.bairro ?? "");
      el("cep").value = (data.cep ?? "");
      el("cidade").value = (data.cidade ?? "");
      el("uf").value = (data.uf ?? "");

      el("last").textContent =
        `Última atualização: ${data.updated_at ? new Date(data.updated_at).toLocaleString("pt-BR") : "—"}`;
    }

    async function save(goBack=false){
      el("btnSalvar").disabled = true;
      el("btnSalvarVoltar").disabled = true;

      const payload = {
        produto: el("produto").value,
        status: el("status").value,
        volume: el("volume").value ? Number(el("volume").value) : null,
        qtd: el("qtd").value ? Number(el("qtd").value) : null,
        obs: el("obs").value || null,
        prox_acao: el("prox_acao").value || null,
        prox_data: el("prox_data").value || null,

        // contato/endereço
        contato_nome: el("contato_nome").value || null,
        contato_telefone: el("contato_telefone").value || null,
        contato_email: el("contato_email").value || null,
        endereco: el("endereco").value || null,
        bairro: el("bairro").value || null,
        cep: el("cep").value || null,
        cidade: el("cidade").value || null,
        uf: (el("uf").value || "").toUpperCase() || null,

        updated_at: new Date().toISOString()
      };

      const { error } = await sb
        .from("actions")
        .update(payload)
        .eq("id", actionId);

      el("btnSalvar").disabled = false;
      el("btnSalvarVoltar").disabled = false;

      if(error){
        toast("Erro ao salvar: " + error.message);
        return;
      }

      toast("✅ Salvo!");
      await load();

      if(goBack) window.location.href = backUrl;
    }

    el("btnSalvar").addEventListener("click", ()=>save(false));
    el("btnSalvarVoltar").addEventListener("click", ()=>save(true));

    await load();
  </script>
</body>
</html>
