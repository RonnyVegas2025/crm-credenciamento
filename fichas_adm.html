<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fichas</title>
  <link rel="stylesheet" href="assets/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Fichas</h1>
      <div class="sub" id="who">Carregando…</div>

      <div class="nav">
        <a href="dashboard.html">📊</a>
        <a href="negociacoes.html">📋</a>
        <a href="nova.html">➕</a>
        <a href="ficha.html">🧾+</a>
        <a href="#" id="btnLogout">🚪</a>
      </div>
    </div>

    <div class="grid2" style="margin-top:12px">
      <div class="card">
        <div class="label">Status</div>
        <select id="status">
          <option value="">Todos</option>
          <option value="rascunho">Rascunho</option>
          <option value="enviada">Enviada</option>
          <option value="em_analise">Em análise</option>
          <option value="aprovada">Aprovada</option>
          <option value="devolvida">Devolvida</option>
          <option value="concluida">Concluída</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
      <div class="card">
        <div class="label">Empresa</div>
        <select id="empresa">
          <option value="">Todas</option>
          <option value="vegas">Vegas</option>
          <option value="ms">M&S</option>
        </select>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <table class="table">
        <thead>
          <tr>
            <th>Empresa</th>
            <th>Cliente</th>
            <th>CNPJ</th>
            <th>Cidade/UF</th>
            <th>Status</th>
            <th>Atualização</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="small" id="empty" style="display:none;margin-top:10px">Nada encontrado.</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { sb } from "./assets/supabaseClient.js";
    import { ensureProfile, logout, toast } from "./assets/app.js";
    const el=(id)=>document.getElementById(id);

    const ctx = await ensureProfile();
    if(!ctx) throw new Error("no session");
    const { user, prof } = ctx;

    el("who").textContent = `${prof.nome||""} • ${prof.role}`;
    el("btnLogout").addEventListener("click",(e)=>{e.preventDefault();logout();});

    const labelEmpresa = (e)=> e==="ms" ? "M&S" : "Vegas";
    const labelStatus = (s)=>({
      rascunho:"Rascunho",
      enviada:"Enviada",
      em_analise:"Em análise",
      aprovada:"Aprovada",
      devolvida:"Devolvida",
      concluida:"Concluída",
      cancelada:"Cancelada"
    }[s] || s);

    async function query(){
      let q = sb
        .from("fichas_credenciamento")
        .select("id,empresa,nome_fantasia,razao_social,cnpj,cidade,uf,status,updated_at,created_by")
        .order("updated_at",{ascending:false});

      // vendedor vê só as dele (RLS já garante, mas deixo explícito)
      if(prof.role==="vendedor") q = q.eq("created_by", user.id);

      if(el("status").value) q=q.eq("status", el("status").value);
      if(el("empresa").value) q=q.eq("empresa", el("empresa").value);

      const { data, error } = await q;
      if(error){ toast("Erro: "+error.message); return []; }
      return data||[];
    }

    function go(id){
      // vendedor edita em ficha.html, adm/gestor revisa em ficha_ver.html
      if(prof.role==="vendedor") window.location.href = `ficha.html?id=${id}`;
      else window.location.href = `ficha_ver.html?id=${id}`;
    }

    function renderRows(list){
      el("rows").innerHTML = list.map(r=>{
        const nome = r.nome_fantasia || r.razao_social || "—";
        const cidade = `${r.cidade||"—"} / ${r.uf||"—"}`;
        const updated = r.updated_at ? new Date(r.updated_at).toLocaleString("pt-BR") : "—";
        return `
          <tr style="cursor:pointer" onclick="window.__go('${r.id}')">
            <td><b>${labelEmpresa(r.empresa)}</b></td>
            <td>${nome}</td>
            <td>${r.cnpj||"—"}</td>
            <td>${cidade}</td>
            <td>${labelStatus(r.status)}</td>
            <td>${updated}</td>
          </tr>
        `;
      }).join("");

      el("empty").style.display = list.length ? "none" : "block";
    }

    window.__go = go;

    async function render(){
      renderRows(await query());
    }

    ["status","empresa"].forEach(i=> el(i).addEventListener("change", render));
    await render();
  </script>
</body>
</html>
