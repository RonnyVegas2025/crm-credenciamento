<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Revisar Ficha</title>
  <link rel="stylesheet" href="assets/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Revisão da Ficha</h1>
      <div class="sub" id="who">Carregando…</div>

      <div class="nav">
        <a href="dashboard.html">📊</a>
        <a href="fichas.html">🧾</a>
        <a href="negociacoes.html">📋</a>
        <a href="#" id="btnLogout">🚪</a>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="grid2">
        <div>
          <div class="label">Cliente</div>
          <div id="cliente" style="font-weight:800">Carregando…</div>
          <div class="small" id="meta"></div>
        </div>
        <div style="text-align:right">
          <a class="btn" href="fichas.html">← Voltar</a>
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="grid2">
        <div class="card" style="background:rgba(255,255,255,.03)">
          <div class="label">Status</div>
          <div id="statusTxt" style="font-weight:800">—</div>
          <div class="small" id="updatedTxt"></div>
        </div>
        <div class="card" style="background:rgba(255,255,255,.03)">
          <div class="label">Observações do revisor (Adm)</div>
          <textarea id="review_notes" rows="4" placeholder="Ex: faltou CEP / falta EC / falta contato financeiro…"></textarea>
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="label" style="font-weight:800">Dados preenchidos</div>
      <div class="small" id="dump"></div>

      <div style="height:16px"></div>

      <div class="grid2">
        <button class="btn" id="btnEmAnalise">Marcar: Em análise</button>
        <button class="btn" id="btnDevolver">Devolver p/ vendedor</button>
      </div>

      <div class="grid2" style="margin-top:10px">
        <button class="btn btnGreen" id="btnAprovar">Aprovar</button>
        <button class="btn" id="btnConcluir">Concluir (cadastrado no Vegas)</button>
      </div>

      <div style="height:10px"></div>
      <div class="small" id="last"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { sb } from "./assets/supabaseClient.js";
    import { ensureProfile, logout, toast } from "./assets/app.js";
    const el=(id)=>document.getElementById(id);

    const ctx = await ensureProfile();
    if(!ctx) throw new Error("no session");
    const { user, prof } = ctx;

    el("who").textContent = `${prof.nome||""} • ${prof.role}`;
    el("btnLogout").addEventListener("click",(e)=>{e.preventDefault();logout();});

    // só gestor/adm
    if(!["gestor","adm"].includes(prof.role)){
      toast("Sem permissão para revisar.");
      window.location.href="fichas.html";
    }

    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    if(!id){
      toast("Sem ID na URL.");
      window.location.href="fichas.html";
    }

    let ficha = null;

    const labelStatus = (s)=>({
      rascunho:"Rascunho",
      enviada:"Enviada",
      em_analise:"Em análise",
      aprovada:"Aprovada",
      devolvida:"Devolvida",
      concluida:"Concluída",
      cancelada:"Cancelada"
    }[s] || s);

    function prettyDump(f){
      const contatos = Array.isArray(f.contatos) ? f.contatos : [];
      return `
        <div style="margin-top:10px;opacity:.95">
          <b>Empresa:</b> ${f.empresa==="ms"?"M&S":"Vegas"}<br/>
          <b>Razão:</b> ${f.razao_social||"—"}<br/>
          <b>Fantasia:</b> ${f.nome_fantasia||"—"}<br/>
          <b>CNPJ:</b> ${f.cnpj||"—"}<br/>
          <b>IE:</b> ${f.inscr_estadual||"—"}<br/>
          <b>Atividade:</b> ${f.ramo_atividade||"—"}<br/><br/>

          <b>Endereço:</b> ${(f.endereco||"—")} ${(f.numero||"")} ${(f.complemento||"")}<br/>
          <b>Bairro:</b> ${f.bairro||"—"}<br/>
          <b>Cidade/UF:</b> ${(f.cidade||"—")} / ${(f.uf||"—")}<br/>
          <b>CEP:</b> ${f.cep||"—"}<br/><br/>

          <b>Meio de captura:</b> ${f.meio_captura||"—"} ${f.meio_captura_outros?("("+f.meio_captura_outros+")"):""}<br/>
          <b>EC Cielo:</b> ${f.ec_cielo||"—"}<br/>
          <b>EC Rede:</b> ${f.ec_rede||"—"}<br/><br/>

          <b>Prazo pagamento:</b> ${f.prazo_pagamento||"—"} ${f.prazo_pagamento_outros?("("+f.prazo_pagamento_outros+")"):""}<br/>
          <b>Custo locação:</b> ${f.custo_locacao ?? "—"}<br/>
          <b>Taxa fidelidade:</b> ${f.taxa_fidelidade ?? "—"}<br/>
          <b>Taxa antecipação:</b> ${f.taxa_antecipacao ?? "—"}<br/><br/>

          <b>Teste ativação:</b> ${f.teste_nome||"—"} | ${f.teste_telefone||"—"} | ${f.teste_email||"—"}<br/><br/>

          <b>Observações:</b> ${f.observacoes||"—"}<br/><br/>

          <b>Contatos:</b><br/>
          ${contatos.length ? contatos.map(c=>`• <b>${c.tipo}</b>: ${c.nome||"—"} | ${c.telefone||"—"} | ${c.email||"—"}<br/>`).join("") : "—"}
        </div>
      `;
    }

    async function load(){
      const { data, error } = await sb
        .from("fichas_credenciamento")
        .select("*")
        .eq("id", id)
        .single();

      if(error){
        toast("Erro ao carregar: "+error.message);
        return;
      }

      ficha = data;
      el("cliente").textContent = data.nome_fantasia || data.razao_social || "—";
      el("meta").textContent = `${data.cidade||"—"} / ${data.uf||"—"} • ${data.cnpj||"—"}`;

      el("statusTxt").textContent = labelStatus(data.status);
      el("updatedTxt").textContent = `Atualizado: ${data.updated_at ? new Date(data.updated_at).toLocaleString("pt-BR") : "—"}`;

      el("review_notes").value = data.review_notes || "";
      el("dump").innerHTML = prettyDump(data);

      el("last").textContent =
        `Criado: ${data.created_at ? new Date(data.created_at).toLocaleString("pt-BR") : "—"} • Revisado: ${data.reviewed_at ? new Date(data.reviewed_at).toLocaleString("pt-BR") : "—"}`;
    }

    async function setStatus(next){
      const payload = {
        status: next,
        review_notes: el("review_notes").value || null,
        reviewed_by: user.id,
        reviewed_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };

      const { error } = await sb
        .from("fichas_credenciamento")
        .update(payload)
        .eq("id", id);

      if(error){
        toast("Erro: "+error.message);
        return;
      }
      toast("✅ Atualizado!");
      await load();
    }

    el("btnEmAnalise").addEventListener("click", ()=>setStatus("em_analise"));
    el("btnDevolver").addEventListener("click", ()=>setStatus("devolvida"));
    el("btnAprovar").addEventListener("click", ()=>setStatus("aprovada"));
    el("btnConcluir").addEventListener("click", ()=>setStatus("concluida"));

    await load();
  </script>
</body>
</html>
